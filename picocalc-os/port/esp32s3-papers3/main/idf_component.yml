# The panel's waveform engine: M5GFX, pinned to the version PULP OS ran on this board
# (esp32-s3-m5/components/s3paper_m5/idf_component.yml). Only its EPD bus and panel are used; touch is
# the OS's own driver (js-papers3/drivers/touch.js), so M5GFX's board autodetect is not called.
dependencies:
  m5stack/m5gfx: "==0.2.25"
  idf: ">=5.3.0"
